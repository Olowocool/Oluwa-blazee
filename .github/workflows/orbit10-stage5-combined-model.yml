name: ORBIT-10 Stage 5 Parsimonious Combined Model

on:
  push:
    branches:
      - "research/historical-pattern-total-test"
    paths:
      - "research/orbit10_stage5_combined_model.py"
      - "research/orbit10_stage3b_pattern1_era_normalized.py"
      - "research/orbit10_stage2_baseline.py"
      - ".github/workflows/orbit10-stage5-combined-model.yml"
      - "data/game.csv"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  combined-model:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas numpy duckdb
      - name: Rebuild frozen baseline and Stage 3B feature history
        run: |
          python -m py_compile research/orbit10_stage2_baseline.py research/orbit10_stage3b_pattern1_era_normalized.py research/orbit10_stage5_combined_model.py
          python research/orbit10_stage2_baseline.py
      - name: Fit and evaluate Stage 5 model
        run: python research/orbit10_stage5_combined_model.py
      - name: Verify Stage 5 evidence and sealed holdout
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd
          out = Path("outputs/research/orbit10_stage5")
          summary_path = out / "orbit10_stage5_combined_summary.json"
          pred_path = out / "orbit10_stage5_combined_predictions.csv"
          assert summary_path.is_file() and summary_path.stat().st_size > 0
          assert pred_path.is_file() and pred_path.stat().st_size > 0
          summary = json.loads(summary_path.read_text())
          pred = pd.read_csv(pred_path)
          assert set(pred["split"].unique()) == {"train", "validation"}
          assert not pred["split"].eq("holdout").any()
          assert len(pred) == pred["game_id"].nunique()
          assert set(summary["validation"]["season_metrics"].keys()) == {"2017", "2018", "2019", "2020"}
          assert summary["training_fit"]["control_games"] >= 100
          assert summary["training_fit"]["qualifying_games"] >= 100
          assert len(summary["training_fit"]["beta_95ci"]) == 2
          assert summary["validation"]["games"] == int((pred["split"] == "validation").sum())
          assert summary["validation"]["model_a_metrics"]["games"] == summary["validation"]["model_b_metrics"]["games"]
          assert "SEALED" in summary["protocol"]["holdout"]
          print("Stage 5 evidence verified; decision:", summary["decision"]["status"])
          print("Validation Model A:", summary["validation"]["model_a_metrics"])
          print("Validation Model B:", summary["validation"]["model_b_metrics"])
          PY
      - name: Upload Stage 5 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ORBIT-10-stage5-combined-model
          path: outputs/research/orbit10_stage5/
          if-no-files-found: warn
          retention-days: 90
