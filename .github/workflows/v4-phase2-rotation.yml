name: NBA totals V4 Phase 2 rotation and injury research

on:
  push:
    branches:
      - "research/live-market-testbench"
    paths:
      - "research/v4_phase2_rotation.py"
      - "research/v4_phase1_core.py"
      - "research/build_player_intelligence_profiles.py"
      - "research/build_player_intelligence_ratings.py"
      - "research/test_player_profile_window_alignment.py"
      - "research/test_full_rotation_output.py"
      - "research/build_player_impact_features.py"
      - ".github/workflows/v4-phase2-rotation.yml"
  workflow_dispatch:

concurrency:
  group: v4-phase2-full-rotation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  phase2:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Java for official injury PDF parser
        run: |
          sudo apt-get update
          sudo apt-get install -y default-jre-headless
      - name: Install research dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pandas<3" "numpy<3" duckdb scikit-learn scipy requests PyPDF2 rapidfuzz "nbainjuries==1.1.1" pyarrow
      - name: Compile player and Phase 2 implementations
        run: |
          python -m py_compile research/build_player_intelligence_profiles.py
          python -m py_compile research/build_player_intelligence_ratings.py
          python -m py_compile research/build_player_impact_features.py
          python -m py_compile research/test_player_profile_window_alignment.py
          python -m py_compile research/v4_phase1_core.py
          python -m py_compile research/v4_phase2_rotation.py
          python -m py_compile research/test_full_rotation_output.py
      - name: Test player profile point-in-time window alignment
        run: python research/test_player_profile_window_alignment.py
      - name: Verify full individual rotation output contract
        run: python research/test_full_rotation_output.py
      - name: Build Stage A player profiles
        run: python research/build_player_intelligence_profiles.py
      - name: Build Stage B descriptive skill components
        run: python research/build_player_intelligence_ratings.py
      - name: Run Phase 2 walk-forward research
        env:
          PYTHONUNBUFFERED: "1"
        run: python research/v4_phase2_rotation.py
      - name: Build Stage C point-in-time player impact features
        run: python research/build_player_impact_features.py
      - name: Download immutable frozen V5 prequential predictions
        uses: actions/download-artifact@v4
        with:
          name: stage-c-v5-residual-comparison
          path: outputs/research/stage_c_v5_predictions
          run-id: 41918521365
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Test full-rotation player skill features against frozen V5
        env:
          PYTHONUNBUFFERED: "1"
          STAGE_C_ARTIFACT_DIR: outputs/research
          PREDICTION_ARTIFACT_DIR: outputs/research/stage_c_v5_predictions
        run: |
          python -m py_compile research/build_player_skill_feature_experiment.py
          python research/build_player_skill_feature_experiment.py
      - name: Upload Stage C and Phase 2 evidence
        uses: actions/upload-artifact@v6
        with:
          name: nba-player-intelligence-stage-c-and-full-rotation-validation
          path: |
            outputs/research/v4_phase2/
            outputs/research/player_intelligence_profiles/
            outputs/research/player_intelligence_stage_c/
            outputs/research/player_skill_feature_experiment/
          if-no-files-found: error
          retention-days: 30
