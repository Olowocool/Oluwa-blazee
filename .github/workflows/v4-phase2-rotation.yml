name: NBA totals V4 Phase 2 rotation and injury research

on:
  push:
    branches:
      - "research/nba-advanced-data-audit"
    paths:
      - "research/v4_phase2_rotation.py"
      - "research/v4_phase1_core.py"
      - ".github/workflows/v4-phase2-rotation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phase2:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Java for official injury PDF parser
        run: |
          sudo apt-get update
          sudo apt-get install -y default-jre-headless
      - name: Install research dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pandas<3" "numpy<3" duckdb scikit-learn scipy requests PyPDF2 rapidfuzz "nbainjuries==1.1.1" pyarrow
      - name: Compile Phase 2 implementation
        run: |
          python -m py_compile research/v4_phase1_core.py
          python -m py_compile research/v4_phase2_rotation.py
      - name: Run Phase 2 walk-forward research
        env:
          PYTHONUNBUFFERED: "1"
        run: python research/v4_phase2_rotation.py
      - name: Upload Phase 2 evidence
        uses: actions/upload-artifact@v6
        with:
          name: nba-totals-v4-phase2-results
          path: outputs/research/v4_phase2/
          if-no-files-found: error
          retention-days: 30
