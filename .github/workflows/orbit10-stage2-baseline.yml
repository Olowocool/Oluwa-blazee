name: ORBIT-10 Stage 2 Baseline

on:
  push:
    branches:
      - "research/historical-pattern-total-test"
    paths:
      - "research/orbit10_stage2_baseline.py"
      - ".github/workflows/orbit10-stage2-baseline.yml"
      - "data/game.csv"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install baseline dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas numpy duckdb
      - name: Inspect source and run ORBIT-10 baseline
        run: |
          python -m py_compile research/orbit10_stage2_baseline.py
          python research/orbit10_stage2_baseline.py || echo "Baseline failed; preserve forensic diagnostics before failing the workflow."
      - name: Upload reproducible Stage 2 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ORBIT-10-stage2-baseline
          path: outputs/research/orbit10_stage2/
          if-no-files-found: warn
          retention-days: 90
      - name: Require successful baseline outputs
        if: always()
        run: test -s outputs/research/orbit10_stage2/orbit10_baseline_summary.json
