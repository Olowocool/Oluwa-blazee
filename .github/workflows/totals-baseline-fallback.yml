name: Totals baseline fallback checks

on:
  pull_request:
    branches: ["main"]
    paths:
      - "points_engine.py"
      - "totals_model.py"
      - "frontend.py"
      - "tests/test_totals_baseline_fallback.py"
      - ".github/workflows/totals-baseline-fallback.yml"

jobs:
  baseline-fallback-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install minimal test dependencies
        run: python -m pip install --upgrade pip pandas numpy
      - name: Compile changed Python modules
        run: |
          python -m py_compile points_engine.py
          python -m py_compile totals_model.py
          python -m py_compile frontend.py
          python -m py_compile tests/test_totals_baseline_fallback.py
      - name: Run baseline fallback regression tests
        run: python -m unittest discover -s tests -p "test_totals_baseline_fallback.py" -v
