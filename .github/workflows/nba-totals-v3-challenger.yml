name: NBA totals V3 challenger

on:
  push:
    branches:
      - "research/nba-advanced-data-audit"
    paths:
      - "totals_model_v3.py"
      - "tests/test_totals_model_v3.py"
      - ".github/workflows/nba-totals-v3-challenger.yml"
      - "data/game.csv"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nba-totals-v3-${{ github.ref }}
  cancel-in-progress: true

jobs:
  v3-challenger:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out research branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install challenger dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pandas pytest

      - name: Inspect raw historical columns
        run: |
          python - <<'PY'
          import pandas as pd
          frame = pd.read_csv("data/game.csv", nrows=0)
          print("Raw game.csv columns:", frame.columns.tolist())
          PY

      - name: Compile V3 module
        run: python -m py_compile totals_model_v3.py

      - name: Run possession and leakage tests
        run: python -m pytest tests/test_totals_model_v3.py -q

      - name: Run chronological historical challenger
        run: |
          python totals_model_v3.py \
            --input data/game.csv \
            --output outputs/research/totals_v3 \
            --max-games 500 \
            --min-prior-team-rows 500 \
            --skip-v2-benchmark

      - name: Upload V3 walk-forward results
        uses: actions/upload-artifact@v4
        with:
          name: nba-totals-v3-challenger
          path: outputs/research/totals_v3/
          if-no-files-found: error
          retention-days: 30
