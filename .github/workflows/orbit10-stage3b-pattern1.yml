name: ORBIT-10 Stage 3B Pattern 1 Era-Normalized Replication

on:
  push:
    branches:
      - "research/historical-pattern-total-test"
    paths:
      - "research/orbit10_stage3b_pattern1_era_normalized.py"
      - "research/orbit10_stage2_baseline.py"
      - ".github/workflows/orbit10-stage3b-pattern1.yml"
      - "data/game.csv"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pattern1-replication:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas numpy duckdb
      - name: Rebuild baseline and run preregistered replication
        run: |
          python -m py_compile research/orbit10_stage2_baseline.py research/orbit10_stage3b_pattern1_era_normalized.py
          python research/orbit10_stage2_baseline.py
          python research/orbit10_stage3b_pattern1_era_normalized.py
      - name: Upload replication evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ORBIT-10-stage3b-pattern1-era-normalized
          path: outputs/research/orbit10_stage3b_pattern1/
          if-no-files-found: warn
          retention-days: 90
      - name: Verify complete evidence and sealed holdout
        if: success()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd

          out = Path("outputs/research/orbit10_stage3b_pattern1")
          summary_path = out / "orbit10_stage3b_pattern1_summary.json"
          predictions_path = out / "orbit10_stage3b_pattern1_predictions.csv"
          assert summary_path.is_file() and summary_path.stat().st_size > 0
          assert predictions_path.is_file() and predictions_path.stat().st_size > 0

          summary = json.loads(summary_path.read_text())
          train = summary["train"]
          ci = train["bootstrap_95ci"]
          assert len(ci) == 2 and all(isinstance(x, (int, float)) for x in ci)
          assert train["bootstrap_95ci_lower"] == ci[0]
          assert train["bootstrap_95ci_upper"] == ci[1]
          assert "validation" in summary and "decision" in summary

          pred = pd.read_csv(predictions_path)
          assert set(pred["split"].unique()) == {"train", "validation"}
          assert not pred["split"].eq("holdout").any()
          assert len(pred) == summary["coverage"]["train"]["eligible_games"] + summary["coverage"]["validation"]["eligible_games"]
          assert bool(summary["decision"]["passes_all"]) in (True, False)
          print("Evidence verified:", len(pred), "train/validation rows; holdout absent; CI:", ci)
          PY
