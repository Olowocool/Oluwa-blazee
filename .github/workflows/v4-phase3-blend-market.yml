name: V4 Phase 3 current-season blend market evaluation

on:
  push:
    branches:
      - "research/nba-advanced-data-audit"
    paths:
      - "research/v4_phase1_core.py"
      - "research/v4_phase3_blend_market.py"
      - "research/v4_phase3_market_residual.py"
      - "research/tests/test_v4_phase3_blend_market.py"
      - ".github/workflows/v4-phase3-blend-market.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  blend-market:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/nba-advanced-data-audit
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install research dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install duckdb pandas numpy scikit-learn tabulate pytest
      - name: Compile research scripts
        run: |
          python -m py_compile research/v4_phase1_core.py research/v4_phase3_market_residual.py research/v4_phase3_blend_market.py
      - name: Run market-blend regression tests
        run: python -m pytest -q research/tests/test_v4_phase3_blend_market.py research/tests/test_v4_phase3_market_residual.py
      - name: Check current 2026-27 V4 pregame-feature coverage
        run: python research/v4_phase3_blend_market.py --check-advanced-source-only
