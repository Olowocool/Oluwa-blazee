name: Full totals chronological backtest and ablation

on:
  pull_request:
    branches: ["main", "audit/chronological-totals-validation"]
    paths:
      - "totals_full_model_backtest.py"
      - "totals_adjustment_ablation.py"
      - "totals_model.py"
      - "points_engine.py"
      - "pace_engine.py"
      - "data/historical_nba_scores.csv"
      - ".github/workflows/totals-full-backtest.yml"

jobs:
  chronological-backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backtest dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pandas

      - name: Compile backtest and ablation modules
        run: |
          python -m py_compile totals_full_model_backtest.py
          python -m py_compile totals_adjustment_ablation.py

      - name: Run chronological full-model backtest
        run: python totals_full_model_backtest.py

      - name: Run development-window adjustment ablation
        run: python totals_adjustment_ablation.py

      - name: Upload backtest and ablation results
        uses: actions/upload-artifact@v4
        with:
          name: totals-adjustment-ablation
          path: |
            outputs/totals_full_model_backtest_results.csv
            outputs/totals_full_model_backtest_summary.csv
            outputs/totals_adjustment_ablation_results.csv
            outputs/totals_adjustment_ablation_summary.csv
          if-no-files-found: error
