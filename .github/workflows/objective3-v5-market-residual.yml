name: Objective 3 V5 market residual validation

on:
  push:
    branches:
      - "research/integrated-totals-lab"
    paths:
      - "research/objective3_v5_market_residual.py"
      - "research/objective3_readiness.py"
      - "research/tests/test_objective3_v5_market_residual.py"
      - "research/tests/test_objective3_readiness.py"
      - "research/collect_public_odds_snapshots.py"
      - "research/tests/test_collect_public_odds_snapshots.py"
      - "points_engine_v5.py"
      - "points_engine_v4.py"
      - "points_engine_v3.py"
      - "totals_betting_backtest.py"
      - "totals_model.py"
      - "team_name_utils.py"
      - ".github/workflows/objective3-v5-market-residual.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  objective3-v5-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/integrated-totals-lab
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install research dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pandas scikit-learn requests beautifulsoup4 pytest
      - name: Compile V5 market evaluator, readiness gate and collector
        run: |
          python -m py_compile research/objective3_v5_market_residual.py
          python -m py_compile research/objective3_readiness.py
          python -m py_compile research/collect_public_odds_snapshots.py
          python -m py_compile points_engine_v5.py
      - name: Run point-in-time, readiness, pricing and walk-forward tests
        run: |
          python -m pytest -q research/tests/test_objective3_v5_market_residual.py
          python -m pytest -q research/tests/test_objective3_readiness.py
          python -m pytest -q research/tests/test_collect_public_odds_snapshots.py
      - name: Check public odds board without saving or exposing prices
        run: python research/collect_public_odds_snapshots.py --check-only
