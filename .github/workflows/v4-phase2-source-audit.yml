name: NBA totals V4 Phase 2 source audit

on:
  push:
    branches:
      - "research/nba-advanced-data-audit"
    paths:
      - "research/v4_phase2_source_audit.py"
      - ".github/workflows/v4-phase2-source-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install --upgrade duckdb pandas pyarrow
      - name: Compile source audit
        run: python -m py_compile research/v4_phase2_source_audit.py
      - name: Inspect source schemas and coverage
        run: python research/v4_phase2_source_audit.py
      - name: Upload source audit
        uses: actions/upload-artifact@v6
        with:
          name: nba-totals-v4-phase2-source-audit
          path: outputs/research/v4_phase2_source_audit/
          if-no-files-found: error
          retention-days: 30
