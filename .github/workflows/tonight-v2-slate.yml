name: Tonight V2 totals screen (research only)

on:
  push:
    branches:
      - "research/nba-advanced-data-audit"
    paths:
      - "research/tonight_v2_slate.py"
      - ".github/workflows/tonight-v2-slate.yml"

permissions:
  contents: read

jobs:
  v2-slate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out research branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install minimal dependency
        run: python -m pip install --upgrade pip pandas

      - name: Run unmodified Points Engine V2 on tonight's slate
        run: python research/tonight_v2_slate.py
