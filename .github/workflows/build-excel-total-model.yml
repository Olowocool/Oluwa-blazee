name: Build NBA Excel Total Points Model
on:
  push:
    branches:
      - research/excel-total-points-model
    paths:
      - 'excel_totals_model/**'
      - '.github/workflows/build-excel-total-model.yml'
  workflow_dispatch:
    inputs:
      game_date:
        description: "NBA target game date (YYYY-MM-DD); blank uses today's UTC date"
        required: false
        type: string
  schedule:
    - cron: "15 10 * * *"
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/excel-total-points-model
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --upgrade pip requests openpyxl duckdb pandas
      - name: Compile source files
        run: python -m py_compile excel_totals_model/refresh_sources.py excel_totals_model/build_workbook.py
      - name: Refresh point-in-time inputs
        env:
          GAME_DATE: ${{ inputs.game_date }}
        run: |
          TARGET_DATE="${GAME_DATE:-$(date -u +%F)}"
          python excel_totals_model/refresh_sources.py --date "$TARGET_DATE"
      - name: Build Excel workbook
        env:
          GAME_DATE: ${{ inputs.game_date }}
        run: python excel_totals_model/build_workbook.py
      - uses: actions/upload-artifact@v4
        with:
          name: NBA-Total-Points-Model
          path: NBA_Total_Points_Model_Automatic.xlsx
          retention-days: 14
