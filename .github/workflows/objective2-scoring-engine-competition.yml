name: Objective 2 fair scoring-engine competition

on:
  push:
    branches:
      - "research/integrated-totals-lab"
    paths:
      - "research/objective2_scoring_engine_competition.py"
      - "tests/test_objective2_scoring_engine_competition.py"
      - ".github/workflows/objective2-scoring-engine-competition.yml"
      - "points_engine.py"
      - "points_engine_v3.py"
      - "points_engine_v4.py"
      - "points_engine_v5.py"
      - "live_market_testbench_engine.py"
      - "team_name_utils.py"
      - "data/historical_nba_scores.csv"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  paired-scoring-competition:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/integrated-totals-lab
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install research dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install duckdb pandas numpy scikit-learn pyarrow requests pytest
      - name: Retrieve completed Phase 2 prediction evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p outputs/research/v4_phase2_reference
          gh run download 41067808476 --repo Olowocool/Oluwa-blazee \
            --name nba-totals-v4-phase2-results \
            --dir outputs/research/v4_phase2_reference
          test -s outputs/research/v4_phase2_reference/v4_phase2_forward_predictions.csv
      - name: Compile and test
        run: |
          python -m py_compile research/objective2_scoring_engine_competition.py
          python -m pytest -q tests/test_objective2_scoring_engine_competition.py
      - name: Run fair chronological scoring-engine competition
        run: |
          python research/objective2_scoring_engine_competition.py \
            --injury-predictions outputs/research/v4_phase2_reference/v4_phase2_forward_predictions.csv \
            --output-dir outputs/research/objective2_scoring_engine_competition
      - name: Upload paired predictions and report
        uses: actions/upload-artifact@v4
        with:
          name: objective2-fair-scoring-engine-competition
          path: outputs/research/objective2_scoring_engine_competition/
          if-no-files-found: error
          retention-days: 30
