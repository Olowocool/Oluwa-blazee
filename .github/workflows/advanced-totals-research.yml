name: Advanced NBA totals research experiment

on:
  push:
    branches:
      - "research/nba-advanced-data-audit"
    paths:
      - "research/advanced_totals_experiment.py"
      - "research/data/dunkapi_recovered_2025-11-26_to_2025-12-23.csv"
      - ".github/workflows/advanced-totals-research.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  point-in-time-experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out research branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install research dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install duckdb pandas numpy scikit-learn pyarrow

      - name: Compile research script
        run: python -m py_compile research/advanced_totals_experiment.py

      - name: Build point-in-time features and evaluate the market archive
        run: python research/advanced_totals_experiment.py

      - name: Upload experiment outputs
        uses: actions/upload-artifact@v4
        with:
          name: advanced-nba-totals-experiment
          path: outputs/research/advanced_totals_experiment/
          if-no-files-found: error
          retention-days: 14
