name: Prospective player snapshot adapter tests
on:
  push:
    branches:
      - research/live-market-testbench
    paths:
      - research/prospective_player_snapshot.py
      - research/prospective_player_data.py
      - tests/test_prospective_player_snapshot.py
      - tests/test_prospective_player_data.py
      - .github/workflows/prospective-player-snapshot-tests.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/live-market-testbench
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install pandas numpy
      - run: python -m py_compile research/prospective_player_snapshot.py research/prospective_player_data.py
      - run: python -m unittest tests.test_prospective_player_snapshot tests.test_prospective_player_data -v
