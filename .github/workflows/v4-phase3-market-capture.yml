name: NBA V4 Phase 3 public odds capture smoke test

on:
  push:
    branches:
      - "research/nba-advanced-data-audit"
    paths:
      - "research/collect_public_odds_snapshots.py"
      - "research/tests/test_collect_public_odds_snapshots.py"
      - "docs/v4_phase3_prospective_market_data_capture.md"
      - ".github/workflows/v4-phase3-market-capture.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parser-and-source-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install collector/test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests beautifulsoup4 pytest
      - name: Compile collector
        run: python -m py_compile research/collect_public_odds_snapshots.py
      - name: Run parser and archive-safety tests
        run: python -m pytest -q research/tests/test_collect_public_odds_snapshots.py
      - name: Validate current public odds page without saving prices
        run: python research/collect_public_odds_snapshots.py --check-only
