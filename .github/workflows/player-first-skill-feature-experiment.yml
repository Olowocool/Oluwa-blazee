name: Player-first skill feature experiment

on:
  workflow_run:
    workflows:
      - "NBA totals V4 Phase 2 rotation and injury research"
    types:
      - completed
    branches:
      - "research/live-market-testbench"
  workflow_dispatch:
    inputs:
      stage_c_run_id:
        description: "Successful Stage C artifact run ID"
        required: true
        default: "41907289358"
      prediction_run_id:
        description: "Successful frozen V5 comparison artifact run ID"
        required: true
        default: "41918521365"

permissions:
  contents: read
  actions: read

jobs:
  player-skill-experiment:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_sha == 'ea6c883302c047acd70e325fbacbdb61b07f0651') }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/live-market-testbench
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Download full-rotation Stage C artifact
        uses: actions/download-artifact@v4
        with:
          name: nba-player-intelligence-stage-c
          path: outputs/research/stage_c_artifact
          run-id: ${{ github.event.workflow_run.id || inputs.stage_c_run_id || '41907289358' }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download immutable frozen V5 comparison predictions
        uses: actions/download-artifact@v4
        with:
          name: stage-c-v5-residual-comparison
          path: outputs/research/stage_c_v5_predictions
          run-id: ${{ inputs.prediction_run_id || '41918521365' }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install research dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pandas<3" "numpy<3" duckdb scikit-learn scipy pyarrow
      - name: Compile experiment
        run: python -m py_compile research/build_player_skill_feature_experiment.py
      - name: Build point-in-time player skill features and compare with frozen V5
        env:
          PYTHONUNBUFFERED: "1"
          STAGE_C_ARTIFACT_DIR: outputs/research/stage_c_artifact
          PREDICTION_ARTIFACT_DIR: outputs/research/stage_c_v5_predictions
        run: python research/build_player_skill_feature_experiment.py
      - name: Upload full-rotation player skill evidence
        uses: actions/upload-artifact@v6
        with:
          name: full-rotation-player-skill-experiment
          path: outputs/research/player_skill_feature_experiment/
          if-no-files-found: error
          retention-days: 30
