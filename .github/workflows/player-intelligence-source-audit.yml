name: NBA player intelligence source audit
on:
  workflow_dispatch:
  push:
    branches:
      - research/live-market-testbench
    paths:
      - .github/workflows/player-intelligence-source-audit.yml
      - research/player_intelligence_source_audit.py
permissions:
  contents: read
jobs:
  player-source-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/live-market-testbench
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install duckdb pandas
      - run: python -m py_compile research/player_intelligence_source_audit.py
      - run: python research/player_intelligence_source_audit.py
      - uses: actions/upload-artifact@v4
        with:
          name: nba-player-intelligence-source-audit
          path: outputs/research/player_intelligence_source_audit/
          if-no-files-found: error
          retention-days: 60
