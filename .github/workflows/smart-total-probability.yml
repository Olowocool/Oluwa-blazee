name: Smart NBA total probability research

on:
  push:
    branches:
      - "research/integrated-totals-lab"
    paths:
      - "research/smart_total_probability.py"
      - "tests/test_smart_total_probability.py"
      - ".github/workflows/smart-total-probability.yml"
      - "research/advanced_totals_experiment.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  point-in-time-probability:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/integrated-totals-lab
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install research dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install duckdb pandas numpy scikit-learn pyarrow joblib pytest requests
      - name: Compile and test
        run: |
          python -m py_compile research/smart_total_probability.py
          python -m pytest -q tests/test_smart_total_probability.py
      - name: Run chronological model competition and probability calibration
        run: python research/smart_total_probability.py --output-dir outputs/research/smart_total_probability
      - name: Upload complete experiment evidence
        uses: actions/upload-artifact@v4
        with:
          name: smart-nba-total-probability
          path: outputs/research/smart_total_probability/
          if-no-files-found: error
          retention-days: 30
