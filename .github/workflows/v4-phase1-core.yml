name: NBA totals V4 Phase 1 core research

on:
  push:
    branches:
      - "research/nba-advanced-data-audit"
    paths:
      - "research/v4_phase1_core.py"
      - ".github/workflows/v4-phase1-core.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phase1:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install research dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install duckdb pandas numpy scikit-learn pyarrow
      - name: Compile phase 1 model
        run: python -m py_compile research/v4_phase1_core.py
      - name: Run point-in-time phase 1 evaluation
        run: python research/v4_phase1_core.py
      - name: Upload phase 1 evidence
        uses: actions/upload-artifact@v4
        with:
          name: nba-totals-v4-phase1
          path: outputs/research/v4_phase1/
          if-no-files-found: error
          retention-days: 30
