name: V2 plus V4 residual-blend research evaluation

on:
  push:
    branches:
      - "research/nba-advanced-data-audit"
    paths:
      - "research/v4_paired_v2_vs_v4_backtest.py"
      - "research/tests/test_v4_paired_v2_vs_v4_backtest.py"
      - "research/v4_v2_residual_blend.py"
      - "research/tests/test_v4_v2_residual_blend.py"
      - ".github/workflows/v4-v2-residual-blend.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  residual-blend:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/nba-advanced-data-audit
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install research dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install duckdb pandas numpy scikit-learn tabulate pytest
      - name: Compile research scripts
        run: |
          python -m py_compile research/v4_phase1_core.py research/v4_paired_v2_vs_v4_backtest.py research/v4_v2_residual_blend.py
      - name: Run regression and residual-blend tests
        run: |
          pytest -q research/tests/test_v4_paired_v2_vs_v4_backtest.py research/tests/test_v4_v2_residual_blend.py
      - name: Rebuild exact-game paired V2 versus V4 predictions
        run: python research/v4_paired_v2_vs_v4_backtest.py
      - name: Fit and evaluate V2 plus V4 residual blend
        run: python research/v4_v2_residual_blend.py
      - name: Upload paired and residual-blend evidence
        uses: actions/upload-artifact@v4
        with:
          name: nba-v2-v4-residual-blend-evaluation
          path: |
            outputs/research/v4_paired_v2_vs_v4/
            outputs/research/v4_v2_residual_blend/
          if-no-files-found: error
          retention-days: 30
