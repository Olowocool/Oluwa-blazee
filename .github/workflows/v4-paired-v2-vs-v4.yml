name: Paired Points Engine V2 versus V4 totals backtest

on:
  push:
    branches:
      - "research/nba-advanced-data-audit"
    paths:
      - "research/v4_paired_v2_vs_v4_backtest.py"
      - "research/tests/test_v4_paired_v2_vs_v4_backtest.py"
      - ".github/workflows/v4-paired-v2-vs-v4.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  paired-backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/nba-advanced-data-audit
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install research dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install duckdb pandas numpy scikit-learn tabulate pytest
      - name: Compile and test paired backtest
        run: |
          python -m py_compile research/v4_phase1_core.py research/v4_paired_v2_vs_v4_backtest.py
          pytest -q research/tests/test_v4_paired_v2_vs_v4_backtest.py
      - name: Run exact-game V2 versus V4 comparison
        run: python research/v4_paired_v2_vs_v4_backtest.py
      - name: Upload paired comparison evidence
        uses: actions/upload-artifact@v4
        with:
          name: nba-paired-v2-vs-v4-backtest
          path: outputs/research/v4_paired_v2_vs_v4/
          if-no-files-found: error
          retention-days: 30
