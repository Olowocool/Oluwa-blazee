name: NBA Stage C rotation source probe
on:
  push:
    branches:
      - research/live-market-testbench
    paths:
      - .github/workflows/stage-c-rotation-source-probe.yml
      - research/stage_c_rotation_source_probe.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rotation-source-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/live-market-testbench
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install duckdb pandas
      - run: python -m py_compile research/stage_c_rotation_source_probe.py
      - run: python research/stage_c_rotation_source_probe.py
      - uses: actions/upload-artifact@v4
        with:
          name: nba-stage-c-rotation-source-probe
          path: outputs/research/stage_c_rotation_probe/
          if-no-files-found: error
          retention-days: 60
