name: Prequential V5 residual correction research
on:
  workflow_dispatch:
  push:
    branches:
      - research/live-market-testbench
    paths:
      - .github/workflows/v5-residual-correction.yml
      - research/v5_residual_correction_experiment.py
      - research/v4_phase1_core.py
permissions:
  contents: read
jobs:
  residual-correction:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/live-market-testbench
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install duckdb pandas numpy scikit-learn pyarrow
      - run: python -m py_compile research/v4_phase1_core.py research/v5_residual_correction_experiment.py
      - run: python research/v5_residual_correction_experiment.py
      - uses: actions/upload-artifact@v4
        with:
          name: nba-v5-residual-correction
          path: outputs/research/v5_residual_correction/
          if-no-files-found: error
          retention-days: 60
