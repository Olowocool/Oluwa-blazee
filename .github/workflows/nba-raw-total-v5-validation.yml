name: NBA raw-total V5 validation

on:
  push:
    branches:
      - "research/nba-advanced-data-audit"
    paths:
      - "points_engine.py"
      - "points_engine_v3.py"
      - "points_engine_v4.py"
      - "points_engine_v5.py"
      - "team_name_utils.py"
      - "totals_backtest_v5.py"
      - "data/historical_nba_scores.csv"
      - ".github/workflows/nba-raw-total-v5-validation.yml"

permissions:
  contents: read

concurrency:
  group: nba-raw-total-v5-${{ github.ref }}
  cancel-in-progress: true

jobs:
  raw-total-v5:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out research branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install model dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pandas

      - name: Compile raw-total engines and validation
        run: |
          python -m py_compile points_engine.py points_engine_v3.py points_engine_v4.py points_engine_v5.py totals_backtest_v5.py team_name_utils.py

      - name: Run V5 chronological integration backtest
        run: python totals_backtest_v5.py

      - name: Upload V5 validation outputs
        uses: actions/upload-artifact@v4
        with:
          name: nba-raw-total-v5-validation
          path: |
            outputs/raw_total_v5_engine_predictions.csv
            outputs/raw_total_v5_engine_summary.csv
            outputs/raw_total_v5_leakage_checks.csv
          if-no-files-found: error
          retention-days: 30
