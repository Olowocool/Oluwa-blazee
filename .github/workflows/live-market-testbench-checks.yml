name: Live market testbench research checks

on:
  pull_request:
    branches: [main]
    paths:
      - "live_market_testbench.py"
      - "live_market_testbench_engine.py"
      - "research/prospective_player_*.py"
      - "research/prospective_rotation_projection.py"
      - "tests/test_live_market_testbench.py"
      - "tests/test_prospective_player_data.py"
      - "tests/test_rapm_rotation_attachment.py"
      - "research/v4_phase2_rotation.py"
      - "requirements.txt"
      - ".github/workflows/live-market-testbench-checks.yml"
  push:
    branches: [research/live-market-testbench]
    paths:
      - "live_market_testbench.py"
      - "live_market_testbench_engine.py"
      - "research/prospective_player_*.py"
      - "research/prospective_rotation_projection.py"
      - "tests/test_live_market_testbench.py"
      - "tests/test_prospective_player_data.py"
      - "requirements.txt"
      - ".github/workflows/live-market-testbench-checks.yml"

jobs:
  testbench:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-testbench.txt
          pip install pytest
      - name: Compile research testbench modules
        run: |
          python -m compileall -q live_market_testbench.py live_market_testbench_engine.py research/prospective_player_data.py research/prospective_rotation_projection.py research/prospective_player_snapshot.py research/v4_phase2_rotation.py
      - name: Run testbench and player point-in-time tests
        run: |
          pytest -q tests/test_live_market_testbench.py tests/test_prospective_player_data.py tests/test_rapm_rotation_attachment.py
