name: Live market testbench research checks

permissions:
  contents: read
  statuses: write

on:
  pull_request:
    branches: [main]
    paths:
      - "live_market_testbench.py"
      - "live_market_testbench_engine.py"
      - "research/prospective_player_*.py"
      - "research/prospective_rotation_projection.py"
      - "tests/test_live_market_testbench.py"
      - "tests/test_prospective_player_data.py"
      - "tests/test_rapm_rotation_attachment.py"
      - "research/v4_phase2_rotation.py"
      - "research/stage_c_v5_residual_experiment.py"
      - "requirements-testbench.txt"
      - ".github/workflows/live-market-testbench-checks.yml"
  push:
    branches: [research/live-market-testbench]
    paths:
      - "live_market_testbench.py"
      - "live_market_testbench_engine.py"
      - "research/prospective_player_*.py"
      - "research/prospective_rotation_projection.py"
      - "tests/test_live_market_testbench.py"
      - "tests/test_prospective_player_data.py"
      - "tests/test_rapm_rotation_attachment.py"
      - "research/v4_phase2_rotation.py"
      - "research/stage_c_v5_residual_experiment.py"
      - "requirements-testbench.txt"
      - ".github/workflows/live-market-testbench-checks.yml"

jobs:
  testbench:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-testbench.txt
          pip install pytest
      - name: Compile research testbench modules
        run: |
          python -m compileall -q live_market_testbench.py live_market_testbench_engine.py research/prospective_player_data.py research/prospective_rotation_projection.py research/prospective_player_snapshot.py research/v4_phase2_rotation.py research/stage_c_v5_residual_experiment.py
      - name: Run testbench and player point-in-time tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          pytest -q tests/test_live_market_testbench.py tests/test_prospective_player_data.py tests/test_rapm_rotation_attachment.py
      - name: Smoke test public possession-based pace source
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python - <<'PY'
          import json
          from live_market_testbench_engine import (
              calculate_game_components, load_pace_history,
              load_score_history, load_team_id_map,
          )
          scores = load_score_history()
          pace_history = load_pace_history()
          result = calculate_game_components(
              "Boston Celtics", "Miami Heat", "2026-11-05",
              scores, pace_history, load_team_id_map(),
              use_pace=True, h2h_mode="off", rest_mode="off",
          )
          assert result["point_in_time_cutoff"] is True
          assert result["pace"]["available"] is True
          assert result["composed"]["use_pace"] is True
          print(json.dumps({
              "games_in_score_history": len(scores),
              "pace_source_seasons": pace_history["seasons_loaded"],
              "expected_matchup_pace": result["pace"]["expected_matchup_pace_l10"],
              "pace_adjustment_points": result["composed"]["pace_adjustment_used"],
              "v5_baseline_total": result["raw_total"],
              "v5_plus_pace_total": result["composed"]["selected_prediction"],
              "strict_prior_date_cutoff": result["point_in_time_cutoff"],
          }, indent=2))
          PY
      - name: Run chronological V5 versus V5-plus-pace backtest
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python - <<'PY'
          import json
          from live_market_testbench_engine import (
              evaluate_pace_challenger, load_pace_history,
              load_score_history, load_team_id_map,
          )
          scores = load_score_history()
          pace_history = load_pace_history()
          _, summary = evaluate_pace_challenger(
              scores, pace_history, load_team_id_map(), bootstrap_resamples=2000,
          )
          assert summary["status"] == "evaluated"
          assert summary["strict_prior_date_history"] is True
          print(json.dumps(summary, indent=2))
          PY
      - name: Publish research test status
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JOB_RESULT: ${{ job.status }}
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [[ "$JOB_RESULT" == "success" ]]; then
            STATE="success"
            DESCRIPTION="Research testbench checks passed"
          else
            STATE="failure"
            DESCRIPTION="Research testbench checks failed"
          fi
          gh api "repos/$REPOSITORY/statuses/$COMMIT_SHA" \
            -f state="$STATE" \
            -f context="live-market-testbench-checks" \
            -f description="$DESCRIPTION" \
            -f target_url="$RUN_URL"
