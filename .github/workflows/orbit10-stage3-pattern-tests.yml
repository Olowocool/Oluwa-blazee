name: ORBIT-10 Stage 3 Individual Pattern Tests

on:
  push:
    branches:
      - "research/historical-pattern-total-test"
    paths:
      - "research/orbit10_stage3_individual_patterns.py"
      - "research/orbit10_stage2_baseline.py"
      - ".github/workflows/orbit10-stage3-pattern-tests.yml"
      - "data/game.csv"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  individual-pattern-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install research dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas numpy duckdb
      - name: Build frozen baseline and run Stage 3
        run: |
          python -m py_compile research/orbit10_stage2_baseline.py research/orbit10_stage3_individual_patterns.py
          python research/orbit10_stage2_baseline.py
          python research/orbit10_stage3_individual_patterns.py
      - name: Upload Stage 2 and Stage 3 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ORBIT-10-stage3-individual-pattern-tests
          path: |
            outputs/research/orbit10_stage2/
            outputs/research/orbit10_stage3/
          if-no-files-found: warn
          retention-days: 90
      - name: Require Stage 3 summary and results
        if: always()
        run: |
          test -s outputs/research/orbit10_stage3/orbit10_stage3_summary.json
          test -s outputs/research/orbit10_stage3/orbit10_stage3_pattern_results.csv
