name: Objective 5-7 research validation

on:
  push:
    branches:
      - "research/integrated-totals-lab"
    paths:
      - "research/objective5_market_comparison.py"
      - "research/tests/test_objective5_market_comparison.py"
      - "research/objective6_bet_selection.py"
      - "research/tests/test_objective6_bet_selection.py"
      - "research/objective7_profitability_validation.py"
      - "research/tests/test_objective7_profitability_validation.py"
      - "research/objective3_v5_market_residual.py"
      - "points_engine_v5.py"
      - "points_engine_v4.py"
      - "points_engine_v3.py"
      - "totals_betting_backtest.py"
      - "totals_model.py"
      - "team_name_utils.py"
      - ".github/workflows/objective5-market-comparison.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  totals-research-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/integrated-totals-lab
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install research dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pandas scikit-learn pytest
      - name: Compile Objective 5-7 evaluators
        run: |
          python -m py_compile research/objective5_market_comparison.py research/objective6_bet_selection.py research/objective7_profitability_validation.py
      - name: Run chronological probability and market comparison tests
        run: |
          python -m pytest -q research/tests/test_objective5_market_comparison.py
          python -m pytest -q research/tests/test_objective6_bet_selection.py
          python -m pytest -q research/tests/test_objective3_v5_market_residual.py
      - name: Run independent profitability settlement tests
        run: python -m pytest -q research/tests/test_objective7_profitability_validation.py
