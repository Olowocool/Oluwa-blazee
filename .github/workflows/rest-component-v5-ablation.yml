name: V5 rest and schedule-density component ablation

on:
  push:
    branches:
      - "research/nba-advanced-data-audit"
    paths:
      - "research/rest_component_v5_ablation.py"
      - "points_engine_v3.py"
      - "points_engine_v4.py"
      - "points_engine_v5.py"
      - ".github/workflows/rest-component-v5-ablation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  v5-rest-ablation:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONPATH: .
    steps:
      - name: Check out research branch
        uses: actions/checkout@v4
        with:
          ref: research/nba-advanced-data-audit
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install research dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install duckdb pandas numpy
      - name: Compile V5 and rest research modules
        run: |
          python -m py_compile points_engine_v3.py points_engine_v4.py points_engine_v5.py research/rest_component_v5_ablation.py
      - name: Run point-in-time rest and schedule-density ablation
        run: python research/rest_component_v5_ablation.py
      - name: Upload rest component evidence
        uses: actions/upload-artifact@v4
        with:
          name: v5-rest-component-ablation
          path: outputs/research/rest_component_v5/
          if-no-files-found: error
          retention-days: 30
