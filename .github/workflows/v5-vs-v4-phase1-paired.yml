name: Paired V5 versus V4 possession-efficiency research
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/live-market-testbench
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install duckdb pandas numpy scikit-learn pyarrow
      - run: python -m py_compile research/v5_vs_v4_phase1_paired.py
      - run: python research/v5_vs_v4_phase1_paired.py
      - uses: actions/upload-artifact@v4
        with:
          name: nba-v5-vs-v4-phase1-paired
          path: outputs/research/v5_vs_v4_phase1/
          if-no-files-found: error
          retention-days: 60
