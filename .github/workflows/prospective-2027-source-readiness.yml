name: Prospective 2026-27 source readiness
on:
  push:
    branches:
      - research/live-market-testbench
    paths:
      - .github/workflows/prospective-2027-source-readiness.yml
      - research/prospective_2027_source_readiness.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/live-market-testbench
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install duckdb pandas
      - run: python -m py_compile research/prospective_2027_source_readiness.py
      - run: python research/prospective_2027_source_readiness.py
      - uses: actions/upload-artifact@v4
        with:
          name: prospective-2027-source-readiness
          path: outputs/research/prospective_2027_readiness/
          if-no-files-found: error
          retention-days: 60
