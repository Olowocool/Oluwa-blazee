name: Forward NBA totals paper validation

on:
  push:
    branches:
      - "research/nba-advanced-data-audit"
    paths:
      - "totals_result_grader.py"
      - "frontend.py"
      - "totals_tracker.py"
      - "tests/test_totals_tracker_idempotency.py"
      - "totals_forward_paper_trading.py"
      - "live_totals_market_snapshots.py"
      - "durable_totals_storage.py"
      - "tests/test_totals_result_grader.py"
      - "tests/test_totals_forward_paper_trading.py"
      - "tests/test_live_totals_market_snapshots.py"
      - ".github/workflows/forward-paper-validation-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-paper-ledger:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NBA_TOTALS_REQUIRE_DURABLE_STORAGE: "false"
    steps:
      - name: Check out research branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas numpy requests

      - name: Compile paper-trading modules and tests
        run: |
          python -m py_compile \
            frontend.py \
            totals_tracker.py \
            totals_result_grader.py \
            totals_forward_paper_trading.py \
            live_totals_market_snapshots.py \
            durable_totals_storage.py \
            tests/test_totals_tracker_idempotency.py \
            tests/test_totals_result_grader.py \
            tests/test_totals_forward_paper_trading.py \
            tests/test_live_totals_market_snapshots.py


      - name: Test first-signal idempotency
        run: python -m unittest discover -s tests -p "test_totals_tracker_idempotency.py" -v

      - name: Test settlement and captured-price accounting
        run: python -m unittest discover -s tests -p "test_totals_result_grader.py" -v

      - name: Test forward ROI and line movement evaluation
        run: python -m unittest discover -s tests -p "test_totals_forward_paper_trading.py" -v

      - name: Test append-only live market snapshots
        run: python -m unittest discover -s tests -p "test_live_totals_market_snapshots.py" -v
