name: NBA player intelligence profile build
on:
  push:
    branches:
      - research/live-market-testbench
    paths:
      - .github/workflows/player-intelligence-profile-build.yml
      - research/build_player_intelligence_profiles.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-player-profiles:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/live-market-testbench
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install duckdb pandas
      - run: python -m py_compile research/build_player_intelligence_profiles.py
      - run: python research/build_player_intelligence_profiles.py
      - uses: actions/upload-artifact@v4
        with:
          name: nba-player-intelligence-profiles
          path: outputs/research/player_intelligence_profiles/
          if-no-files-found: error
          retention-days: 60
