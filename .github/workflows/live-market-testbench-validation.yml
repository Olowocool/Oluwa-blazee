name: Live market test-bench validation

on:
  push:
    branches:
      - "research/live-market-testbench"
      - "research/live-player-strength-integration"
    paths:
      - "live_market_testbench.py"
      - "research/live_player_strength.py"
      - "research/live_player_strength_testbench.py"
      - "research/prospective_player_data.py"
      - "research/prospective_rotation_projection.py"
      - "research/build_prospective_pregame_records.py"
      - "tests/test_live_player_strength.py"
      - "live_market_testbench_engine.py"
      - "points_engine.py"
      - "points_engine_v3.py"
      - "points_engine_v4.py"
      - "points_engine_v5.py"
      - "team_name_utils.py"
      - "team_map.json"
      - "data/historical_nba_scores.csv"
      - "tests/test_live_market_testbench.py"
      - "requirements-testbench.txt"
      - ".github/workflows/live-market-testbench-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-testbench:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: .
    steps:
      - name: Check out test-bench branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test-bench dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-testbench.txt
      - name: Compile app and model modules
        run: |
          python -m py_compile \
            live_market_testbench.py \
            live_market_testbench_engine.py \
            points_engine.py \
            points_engine_v3.py \
            points_engine_v4.py \
            points_engine_v5.py \
            team_name_utils.py \
            research/live_player_strength.py \
            research/live_player_strength_testbench.py \
            research/prospective_player_data.py \
            research/prospective_rotation_projection.py \
            research/build_prospective_pregame_records.py \
            research/v4_phase2_rotation.py
      - name: Run unit tests
        run: python -m pytest -q tests/test_live_market_testbench.py tests/test_live_player_strength.py tests/test_live_player_strength_testbench.py tests/test_v4_phase2_rotation_rapm.py
      - name: Smoke-test player-strength inference imports
        run: |
          python - <<'PY'
          import research.live_player_strength
          import research.live_player_strength_testbench
          import research.prospective_player_data
          import research.prospective_rotation_projection
          import research.build_prospective_pregame_records
          print("Player-strength inference and prospective adapters imported successfully.")
          PY
      - name: Verify bundled historical score history
        run: |
          python - <<'PY'
          from live_market_testbench_engine import load_score_history
          history = load_score_history()
          assert len(history) > 60000, f"Unexpectedly small history: {len(history)}"
          assert history["game_date"].notna().all()
          assert history[["home_score", "away_score"]].notna().all().all()
          print({
              "rows": len(history),
              "latest_date": str(history["game_date"].max().date()),
              "teams": len(set(history["home_team"]) | set(history["away_team"])),
          })
          PY
      - name: Smoke-test V5 total plus point-in-time components
        run: |
          python - <<'PY'
          from live_market_testbench_engine import (
              calculate_game_components,
              load_score_history,
              load_team_id_map,
          )
          history = load_score_history()
          prediction = calculate_game_components(
              "Boston Celtics",
              "Miami Heat",
              "2026-11-01",
              history,
              None,
              load_team_id_map(),
              use_pace=False,
              h2h_mode="off",
              rest_mode="off",
          )
          assert prediction["raw_total"] > 0
          assert prediction["point_in_time_cutoff"] is True
          assert prediction["composed"]["selected_prediction"] == prediction["raw_total"]
          print({
              "v5_raw_total": prediction["raw_total"],
              "history_rows": len(history),
              "target_date": prediction["target_date"],
              "strict_cutoff": prediction["point_in_time_cutoff"],
          })
          PY
      - name: Verify Streamlit CLI
        run: streamlit --version
