name: CI

on:
  push:
    branches: ["main", "analysis/totals-durable-postgres-ledger-20261029"]
  pull_request:
    branches: ["main", "analysis/timestamped-live-totals-market-20261029"]
  workflow_dispatch:

jobs:
  totals-leakage-tests:
    runs-on: ubuntu-latest
    env:
      NBA_TOTALS_TEST_DATABASE_URL: postgresql://nba_totals:nba_totals@localhost:5432/nba_totals_test
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: nba_totals
          POSTGRES_PASSWORD: nba_totals
          POSTGRES_DB: nba_totals_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nba_totals -d nba_totals_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas scikit-learn joblib requests "psycopg[binary]>=3.2,<4"

      - name: Compile changed Python modules
        run: |
          python -m py_compile app.py pregame_history_guard.py points_engine.py pace_engine.py team_name_utils.py totals_model.py totals_backtest.py totals_ai_predictor.py totals_auto_learning.py train_totals_model.py best_bet_selector_v2.py generate_totals_test_data.py frontend.py totals_full_model_backtest.py totals_betting_backtest.py collect_historical_totals_odds.py dunkapi_totals_close_backtest.py totals_tracker.py totals_result_grader.py prediction_history_logger.py tests/test_dunkapi_totals_close_backtest.py tests/test_team_name_normalization.py tests/test_historical_totals_odds_collector.py tests/test_totals_leakage_guards.py tests/test_totals_projection_reconciliation.py tests/test_totals_chronological_backtest.py tests/test_totals_betting_backtest.py tests/test_points_engine_leakage_guard.py live_injuries.py live_totals_market_snapshots.py tests/test_live_totals_market_snapshots.py durable_totals_storage.py tests/test_durable_totals_storage.py totals_forward_paper_trading.py tests/test_totals_forward_paper_trading.py tests/test_live_injuries.py

      - name: Run totals leakage guard tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
