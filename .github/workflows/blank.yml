name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  totals-leakage-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas scikit-learn joblib requests

      - name: Compile changed Python modules
        run: |
          python -m py_compile points_engine.py pace_engine.py team_name_utils.py totals_model.py totals_backtest.py totals_ai_predictor.py totals_auto_learning.py train_totals_model.py best_bet_selector_v2.py generate_totals_test_data.py frontend.py totals_full_model_backtest.py totals_betting_backtest.py collect_historical_totals_odds.py dunkapi_totals_close_backtest.py tests/test_dunkapi_totals_close_backtest.py tests/test_team_name_normalization.py tests/test_historical_totals_odds_collector.py tests/test_totals_leakage_guards.py tests/test_totals_projection_reconciliation.py tests/test_totals_chronological_backtest.py tests/test_totals_betting_backtest.py tests/test_points_engine_leakage_guard.py

      - name: Run totals leakage guard tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
