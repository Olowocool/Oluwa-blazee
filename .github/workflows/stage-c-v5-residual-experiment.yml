name: Stage C player intelligence versus frozen V5

on:
  push:
    branches:
      - "research/live-market-testbench"
    paths:
      - "research/stage_c_v5_residual_experiment.py"
      - ".github/workflows/stage-c-v5-residual-experiment.yml"
  workflow_dispatch:
    inputs:
      artifact_run_id:
        description: "Successful Phase 2 / Stage C workflow run ID"
        required: true
        default: "41927525239"

permissions:
  contents: write
  actions: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/live-market-testbench
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Download immutable Stage C evidence
        uses: actions/download-artifact@v4
        with:
          name: nba-player-intelligence-stage-c-full-rotation
          path: outputs/research/stage_c_artifact
          run-id: ${{ inputs.artifact_run_id || '41927525239' }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install research dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pandas<3" "numpy<3" duckdb scikit-learn scipy pyarrow
      - name: Compile experiment
        run: python -m py_compile research/stage_c_v5_residual_experiment.py
      - name: Run Stage C versus frozen V5 prequential experiment
        env:
          PYTHONUNBUFFERED: "1"
          STAGE_C_ARTIFACT_DIR: outputs/research/stage_c_artifact
        run: python research/stage_c_v5_residual_experiment.py
      - name: Commit generated live player-strength calibration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/live_player_strength_calibration.json
          if git diff --cached --quiet; then
            echo "Calibration file unchanged; no commit required."
            exit 0
          fi
          git commit -m "Add point-in-time live player-strength calibration"
          git push origin HEAD:research/live-market-testbench
      - name: Upload paired V5 comparison evidence
        uses: actions/upload-artifact@v6
        with:
          name: stage-c-v5-residual-comparison
          path: outputs/research/stage_c_v5_comparison/
          if-no-files-found: error
          retention-days: 30
